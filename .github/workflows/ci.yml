name: FastAPI CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python3 -m pytest


    docker:
      name: Build and Push Docker Image
      needs: test
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build Docker image
          run: |
            docker build \
              -t ${{ secrets.DOCKER_USERNAME }}/fastapi-github-actions:latest .

        - name: Push Docker image
          run: |
            docker push \
              ${{ secrets.DOCKER_USERNAME }}/fastapi-github-actions:latest